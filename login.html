<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flipkart  Login</title>
<link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-box">

 
  <div class="left-panel">
    <h2>Login</h2>
    <p>
      Get access to your Orders,<br>
      Wishlist and Recommendations
    </p>
  </div>

  <div class="right-panel">
    <div class="error" id="errorMsg"></div>

    <input type="text" class="input-box" id="user"
           placeholder="Enter Email / Mobile number">

    <input type="password" class="input-box" id="pass"
           placeholder="Enter Password">

    <button class="login-btn" onclick="login()">Login</button>
    <button class="otp-btn">Request OTP</button>

    <p class="terms">
      By continuing, you agree to Flipkart's
      Terms of Use and Privacy Policy.
    </p>

  
    <div class="create" onclick="openSignup()">
  New to Flipkart? Create an account
</div>

  </div>

</div>

<script>
function login(){
  let user = document.getElementById("user").value.trim();
  let pass = document.getElementById("pass").value.trim();
  let error = document.getElementById("errorMsg");

  if(user === "" || pass === ""){
    error.style.display = "block";
    error.innerText = "Please enter valid Email/Mobile and Password";
    return;
  }

  if(pass.length < 6){
    error.style.display = "block";
    error.innerText = "Password must be minimum 6 characters";
    return;
  }

  error.style.display = "none";
  alert("Login Successful (Flipkart Clone)");
  window.location.href = "login.html";
}
function openSignup(){
  window.location.href = "signup.html";
}

function openLogin(){
  window.location.href = "login.html";
}

</script>

</body>
</html>
